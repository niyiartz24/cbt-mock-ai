services:
  - type: web
    name: cbt-mock-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cbt-mock-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: cbt-mock-db
    plan: free
    databaseName: cbt_mock
    user: cbt_user
