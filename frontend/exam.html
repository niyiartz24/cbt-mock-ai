<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Exam — CBT Mock AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container navbar-inner">
      <div style="display:flex; align-items:center; gap:1rem;">
        <a id="back-link" href="index.html" class="btn btn-ghost btn-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.25rem">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Back
        </a>
        <span class="navbar-brand" style="font-size:1rem;">
          <span class="brand-dot"></span>
          <span id="course-name-display">Loading...</span>
        </span>
      </div>
      <div class="navbar-actions">
        <button class="theme-toggle" id="theme-toggle" title="Toggle theme">☀</button>
      </div>
    </div>
  </nav>

  <div class="container exam-layout">

    <!-- Loading state -->
    <div id="exam-loading">
      <div class="loading-state" style="min-height: 60vh;">
        <div class="spinner spinner-lg"></div>
        <p>Loading exam questions...</p>
      </div>
    </div>

    <!-- Exam body -->
    <div id="exam-body" class="hidden">

      <!-- Exam header: timer + progress -->
      <div class="exam-header">
        <div>
          <p style="font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:0.25rem; font-weight:600;">Progress</p>
          <div style="display:flex; align-items:center; gap:0.75rem;">
            <div class="progress-bar" style="width:160px;">
              <div class="progress-fill" id="progress-fill" style="width:0%"></div>
            </div>
            <span id="answered-count" style="font-size:0.78rem; color:var(--text-muted); font-family:var(--font-mono);">0/40 answered</span>
          </div>
        </div>

        <div style="display:flex; align-items:center; gap:0.75rem;">
          <span id="question-counter" class="question-counter">1 / 40</span>
          <div class="timer-display" id="timer-display">10:00</div>
        </div>
      </div>

      <!-- Question grid navigator -->
      <div id="question-grid-nav" class="question-grid-nav"></div>

      <!-- Question card -->
      <div class="question-card">
        <p class="question-number" id="question-number">Question 1</p>
        <p class="question-text" id="question-text"></p>
        <div class="options-grid" id="options-grid"></div>
      </div>

      <!-- Navigation -->
      <div class="exam-nav">
        <button class="btn btn-ghost" id="btn-prev" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Previous
        </button>

        <button class="btn btn-danger btn-sm" id="btn-submit">
          Submit Exam
        </button>

        <button class="btn btn-primary" id="btn-next">
          Next
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Results -->
    <div id="exam-results" class="hidden" style="padding: 2rem 0 4rem;">
      <div id="results-header"></div>

      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
        <h2 style="font-family:var(--font-display); font-size:1.2rem;">Detailed Breakdown</h2>
        <button class="btn btn-ghost btn-sm" id="btn-retry">Start New Exam</button>
      </div>

      <div id="results-detail"></div>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/exam.js"></script>

  <!-- SynthaxLab Watermark -->
  <div class="synthaxlab-watermark">
    <a class="synthaxlab-watermark-inner" href="https://synthaxlab.netlify.app" target="_blank" rel="noopener">
      <span class="synthaxlab-watermark-dot"></span>
      <span class="synthaxlab-watermark-text">
        <span class="wm-prefix">Built by </span><strong>SynthaxLab</strong>
      </span>
    </a>
  </div>

</body>
</html>
